
name: Auto-generate TYYW Map

on:
  push:
    branches:
      - main
    paths:
      - '**/*.gpx'
      - '**/shops.json'
      - '**/README.md'
      - 'scripts/generate_map.py'
      - 'scripts/generate_home.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: generate-map
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install folium gpxpy

      - name: Generate Maps for All Months
        shell: bash
        run: |
          shopt -s nullglob
          folders=(????-??/)

          for folder in "${folders[@]}"; do
            folder_name="${folder%/}"
            echo "正在產生 $folder_name"
            python scripts/generate_map.py "$folder_name"
          done

      - name: Generate Homepage Index
        run: python scripts/generate_home.py

      - name: Commit and Push Map
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: 更新桃園藝文店地圖"
            git pull --rebase
            git push
          fi

      - name: Prepare Website
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/index.html

          shopt -s nullglob

          for folder in ????-??/; do
            if [ -f "${folder}index.html" ]; then
              mkdir -p "_site/${folder}"
              cp "${folder}index.html" "_site/${folder}index.html"
            fi
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Website
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
