
name: Auto-generate TYYW Map

on:
  push:
    paths:
      - '**.gpx'
      - '**/shops.json'
      - 'scripts/generate_map.py'
      - 'scripts/generate_home.py'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-map
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install folium gpxpy

      - name: Generate Maps for All Months
        shell: bash
        run: |
          shopt -s nullglob
          folders=(????-??/)

          if [ ${#folders[@]} -eq 0 ]; then
            echo "找不到任何月份資料夾"
          fi

          for folder in "${folders[@]}"; do
            folder_name="${folder%/}"
            echo "正在產生 $folder_name"
            python scripts/generate_map.py "$folder_name"
          done

      - name: Generate Homepage Index
        run: python scripts/generate_home.py

      - name: Commit and Push Map
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: 更新桃園藝文店地圖"
            git pull --rebase
            git push
          fi
